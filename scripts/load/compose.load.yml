services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
    cpus: 2.0
    mem_limit: 512m
    command: [postgres, -c, max_connections=60, -c, shared_buffers=128MB]
    environment:
      POSTGRES_DB: atlas_load
      POSTGRES_USER: atlas_load
      POSTGRES_PASSWORD: ${ATLAS_LOAD_PASSWORD:?}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U atlas_load -d atlas_load"]
      interval: 2s
      timeout: 3s
      retries: 30
  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
    cpus: 1.0
    mem_limit: 1024m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
  redis:
    image: redis:8.4.7-alpine3.22@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
    cpus: 0.5
    mem_limit: 128m
    command: [redis-server, --save, "", --appendonly, "no"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    image: atlas-load:${ATLAS_LOAD_SESSION:?}
    build:
      context: ../..
      dockerfile: Dockerfile
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
    cpus: 2.0
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -XX:ActiveProcessorCount=2
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/atlas_load?ApplicationName=atlas-load-api
      SPRING_DATASOURCE_USERNAME: atlas_load
      SPRING_DATASOURCE_PASSWORD: ${ATLAS_LOAD_PASSWORD:?}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 2
      ATLAS_LOCAL_ALICE_PASSWORD: ${ATLAS_LOAD_PASSWORD:?}
      ATLAS_LOCAL_BOB_PASSWORD: ${ATLAS_LOAD_PASSWORD:?}
      ATLAS_LOCAL_ADMIN_PASSWORD: ${ATLAS_LOAD_PASSWORD:?}
      ATLAS_HOLD_TTL_SECONDS: 3600
      ATLAS_EXPIRATION_ENABLED: "true"
      ATLAS_EXPIRATION_POLL_MS: 1000
      ATLAS_EXPIRATION_BATCH_SIZE: 100
      ATLAS_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ATLAS_KAFKA_PUBLISHER_ENABLED: "true"
      ATLAS_KAFKA_CONSUMER_ENABLED: "true"
      ATLAS_KAFKA_POLL_MS: 100
      ATLAS_KAFKA_BATCH_SIZE: 20
      ATLAS_REDIS_ENABLED: "true"
      ATLAS_REDIS_HOST: redis
      ATLAS_REDIS_PORT: 6379
      ATLAS_REDIS_CONNECT_TIMEOUT_MS: 100
      ATLAS_REDIS_COMMAND_TIMEOUT_MS: 100
      ATLAS_REDIS_FILL_BUDGET_MS: 1000
      ATLAS_RECOVERY_ENABLED: "true"
      ATLAS_RECOVERY_POLL_MS: 1000
      ATLAS_RECOVERY_BATCH_SIZE: 100
      ATLAS_RECOVERY_MAX_ATTEMPTS: 5
      ATLAS_RECOVERY_BASE_DELAY_MS: 1000
      ATLAS_RECOVERY_MAX_DELAY_MS: 60000
    ports: ["127.0.0.1:${ATLAS_LOAD_API_PORT:?}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  postgres-data:
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
  kafka-data:
    labels: {atlas.load.session: "${ATLAS_LOAD_SESSION:?}"}
