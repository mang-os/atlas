name: atlas
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    profiles: [redis]
    image: redis:8.4.7-alpine3.22@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: [kafka]
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    profiles: [app]
    image: atlas:0.1.0-local
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      ATLAS_RECOVERY_ENABLED: ${ATLAS_RECOVERY_ENABLED:-true}
      ATLAS_RECOVERY_POLL_MS: ${ATLAS_RECOVERY_POLL_MS:-10000}
      ATLAS_RECOVERY_BATCH_SIZE: ${ATLAS_RECOVERY_BATCH_SIZE:-100}
      ATLAS_RECOVERY_STUCK_MS: ${ATLAS_RECOVERY_STUCK_MS:-60000}
      ATLAS_RECOVERY_MAX_ATTEMPTS: ${ATLAS_RECOVERY_MAX_ATTEMPTS:-5}
      ATLAS_RECOVERY_BASE_DELAY_MS: ${ATLAS_RECOVERY_BASE_DELAY_MS:-1000}
      ATLAS_RECOVERY_MAX_DELAY_MS: ${ATLAS_RECOVERY_MAX_DELAY_MS:-60000}
      ATLAS_HOLD_TTL_SECONDS: ${ATLAS_HOLD_TTL_SECONDS:-300}
      ATLAS_EXPIRATION_ENABLED: ${ATLAS_EXPIRATION_ENABLED:-true}
      ATLAS_EXPIRATION_POLL_MS: ${ATLAS_EXPIRATION_POLL_MS:-1000}
      ATLAS_EXPIRATION_BATCH_SIZE: ${ATLAS_EXPIRATION_BATCH_SIZE:-100}
      ATLAS_KAFKA_ENABLED: ${ATLAS_KAFKA_ENABLED:-false}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ATLAS_KAFKA_PUBLISHER_ENABLED: ${ATLAS_KAFKA_PUBLISHER_ENABLED:-true}
      ATLAS_KAFKA_CONSUMER_ENABLED: ${ATLAS_KAFKA_CONSUMER_ENABLED:-true}
      ATLAS_KAFKA_POLL_MS: ${ATLAS_KAFKA_POLL_MS:-1000}
      ATLAS_KAFKA_BATCH_SIZE: ${ATLAS_KAFKA_BATCH_SIZE:-20}
      ATLAS_REDIS_ENABLED: ${ATLAS_REDIS_ENABLED:-false}
      ATLAS_REDIS_HOST: redis
      ATLAS_REDIS_PORT: 6379
      ATLAS_REDIS_CONNECT_TIMEOUT_MS: ${ATLAS_REDIS_CONNECT_TIMEOUT_MS:-100}
      ATLAS_REDIS_COMMAND_TIMEOUT_MS: ${ATLAS_REDIS_COMMAND_TIMEOUT_MS:-100}
      ATLAS_REDIS_FILL_BUDGET_MS: ${ATLAS_REDIS_FILL_BUDGET_MS:-1000}
      ATLAS_LOCAL_ALICE_PASSWORD: ${ATLAS_LOCAL_ALICE_PASSWORD:-}
      ATLAS_LOCAL_BOB_PASSWORD: ${ATLAS_LOCAL_BOB_PASSWORD:-}
      ATLAS_LOCAL_ADMIN_PASSWORD: ${ATLAS_LOCAL_ADMIN_PASSWORD:-}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atlas}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-atlas}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
